<!DOCTYPE html>
<html lang="id">
<head>

    <title>XENZEN</title>
    <style>
        /* Mengimpor font bergaya monospaced/retro */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        /* Proteksi agar teks tidak bisa di-copy/diseleksi */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent; /* Menghilangkan highlight biru saat diklik pada layar sentuh */
        }
          html {
          scrollbar-width: none;
           -ms-overflow-style: none;
        }
           html::-webkit-scrollbar {
           display: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('agnas.png');
            background-size: cover;
            background-position: center;
            background-repeat: no repeat;
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Foto Profil Dalam Lingkaran */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 25%;
            object-fit: cover;
            border: 2px solid #ffffff;
            margin-bottom: 20px;
        }

        /* Judul XENZEN */
        .title {
            font-size: 38px;
            letter-spacing: 4px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Tag Developer */
        .developer-badge {
            border: 1px solid #ffffff;
            border-radius: 10px;
            padding: 4px 14px;
            font-size: 13px;
            color: #6366f1;
            margin-bottom: 25px;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.5);
        }

        /* Container Tombol Links */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Desain Tombol */
        .link-card {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ffffff;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            background: lab(0% 0 0 / 0.24705882352941178);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background-color 0.2s ease, transform 0.1s ease;
            outline: none; /* Menghilangkan outline biru */
        }

        /* Mencegah Outline Biru Saat Fokus/Klik */
        .link-card:focus, 
        .link-card:active {
            outline: none !important;
            box-shadow: none !important;
        }

        .link-card:hover {
            outline: 3px solid hwb(240 0% 0% / 0.30196078431372547);
            background-color: rgba(255, 255, 255, 0.16470588235294117);
        }

        .link-card:active {
            transform: scale(0.98);
        }

        /* Icon Wrapper */
        .icon-box {
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        /* Teks Menu */
        .link-text {
            flex-grow: 1;
            text-align: center;
            font-size: 18px;
            letter-spacing: 1px;
            font-weight: lighter;
            margin-right: 42px; /* Menyeimbangkan posisi teks akibat adanya ikon di kiri */
            text-transform: uppercase;
        }

        /* Warna Latar Belakang Ikon */
        .wa-bg { background-color: #25d366; }
        .tg-bg { background-color: #24a1de; }
        .tk-bg { background-color: #000000; border: 1px solid #333; }
        
        .ig-bg {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);
        }

        .icon-svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }
    </style>
</head>
